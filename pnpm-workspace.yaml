packages:
  - "apps/*"
  - "packages/*"

catalogs:
  default:
    # Every Effect package shares one version. Bump them together.
    effect: "4.0.0-rc.111"
    "@effect/platform-node": "4.0.0-rc.111"
    "@effect/sql-pg": "4.0.0-rc.111"
    "@effect/opentelemetry": "4.0.0-rc.111"
    "@effect/vitest": "4.0.0-rc.111"
    # rc.4 crashes at import against effect rc.111; keep orm and kit in step.
    drizzle-orm: "1.0.0-rc.5-169397b"
    drizzle-kit: "1.0.0-rc.5-ab785fc"
    typescript: "^7.0.2"
    react: "^19.2.8"
    react-dom: "^19.2.8"
    better-auth: "^1.7.1"
    "@dodopayments/better-auth": "^1.6.5"
    dodopayments: "^2.47.0"
    resend: "^6.22.0"
    "@react-email/components": "^1.0.12"
    ai: "^7.0.77"
    "@ai-sdk/anthropic": "^4.0.41"
    posthog-js: "^1.418.10"
    posthog-node: "^5.50.0"
    tailwindcss: "^4.3.3"
    "@t3-oss/env-core": "^0.13.11"
    zod: "^4.4.3"
    vitest: "^4.1.11"
    "@testcontainers/postgresql": "^12.1.0"
    # TanStack DB is pre-1.0 and moves weekly — pin exact, same as the Effect rc.
    "@electric-sql/client": "1.5.26"
    "@tanstack/db": "0.8.5"
    "@tanstack/react-db": "0.3.5"
    "@tanstack/electric-db-collection": "0.4.5"
